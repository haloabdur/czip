[workspace]
resolver = "2"
members = ["crates/czip-core", "crates/czip-cli", "app/src-tauri"]
# The desktop app needs WebView system libraries; build it explicitly.
default-members = ["crates/czip-core", "crates/czip-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 1
