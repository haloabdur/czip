name: Release

# Builds installers for Windows, macOS and Linux and publishes them as a
# GitHub Release named after the version in app/src-tauri/tauri.conf.json.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: "--target universal-apple-darwin"
          - name: Linux
            os: ubuntu-22.04
            args: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2

      - name: WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app/src-tauri
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          tagName: v__VERSION__
          releaseName: czip v__VERSION__
          releaseBody: |
            Unduh installer untuk sistem kamu:
            - **Windows**: `.msi` atau `-setup.exe`
            - **macOS**: `.dmg` (Apple Silicon & Intel)
            - **Linux**: `.deb` (Debian/Ubuntu), `.rpm` (Fedora), atau `.AppImage`

            Installer belum ditandatangani. Windows mungkin menampilkan SmartScreen
            ("More info" → "Run anyway"); di macOS klik kanan aplikasi → Open.
          releaseDraft: false
          prerelease: false
